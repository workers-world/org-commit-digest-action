name: Validate action

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["dev_*", "master"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
        with:
          # 发版闸需 diff PR base 与全量 tag
          fetch-depth: 0

      - name: Check action metadata
        run: |
          set -euo pipefail
          test -f action.yml
          test -f digest.py
          test -x digest.sh
          grep -q 'name: Org commit digest' action.yml
          grep -q 'workers-world/action-notify-email@v1' action.yml
          grep -q 'html-file:' action.yml
          grep -q 'attachment-file:' action.yml
          grep -q 'digest-csv-file' action.yml
          ! grep -q 'id: load-html' action.yml
          python3 -m py_compile digest.py noise_filter.py
          python3 -m unittest discover -s tests -v
          test -f .github/workflows/tag-release.yml
          # 版本权威 = package.json version（tag-release 据此打 v* tag），格式在 PR 阶段把关
          node -e "const v=require('./package.json').version; if(!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(String(v))) { console.error('package.json version 须为 X.Y.Z，当前: '+v); process.exit(1); }"

      - name: 发版闸（产品文件变更须 bump package.json version）
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/check-release-bump.mjs --base="$BASE_BRANCH" --tag-prefix=v
